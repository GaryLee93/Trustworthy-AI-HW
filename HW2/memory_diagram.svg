<?xml version="1.0" encoding="UTF-8"?>
<!-- Memory mechanism of MyAgent (Experiment 1 - Update 4, used with the E3 model).
     Render: rsvg-convert -z 3 memory_diagram.svg -o memory_diagram.png
     Colors: write = blue, read = green, update = orange, abstain = red. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395"
     font-family="Noto Sans CJK TC" font-size="12" fill="#222">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <style>
      .write  { fill: #dce8f7; stroke: #4a7ab5; }
      .read   { fill: #dcefdf; stroke: #4a9a5b; }
      .update { fill: #fde5c8; stroke: #d08a2e; }
      .abst   { fill: #f7dada; stroke: #c05050; }
      .neutral{ fill: #f2f2f2; stroke: #777777; }
      .e      { stroke: #555; stroke-width: 1.2; fill: none; marker-end: url(#arr); }
      .ed     { stroke: #999; stroke-width: 1.2; fill: none; marker-end: url(#arrg); stroke-dasharray: 5 3; }
      .lbl    { font-size: 11px; fill: #444; }
      .title  { font-size: 13px; font-weight: bold; }
      .c      { text-anchor: middle; }
    </style>
  </defs>

  <!-- legend -->
  <g transform="translate(735,14)" font-size="11">
    <rect class="write"  x="0"   y="0" width="58" height="20" rx="3"/><text class="c" x="29"  y="14">write</text>
    <rect class="read"   x="64"  y="0" width="58" height="20" rx="3"/><text class="c" x="93"  y="14">read</text>
    <rect class="update" x="128" y="0" width="58" height="20" rx="3"/><text class="c" x="157" y="14">update</text>
    <rect class="abst"   x="192" y="0" width="58" height="20" rx="3"/><text class="c" x="221" y="14">abstain</text>
  </g>

  <!-- ===== WRITE ===== -->
  <rect x="10" y="10" width="665" height="125" rx="10" fill="none" stroke="#4a7ab5" stroke-width="1.5"/>
  <text class="title" x="22" y="30" fill="#4a7ab5">WRITE: chat(utterance)</text>

  <text x="22" y="76">utterance</text>
  <path class="e" d="M88,72 L120,72"/>

  <polygon class="write" points="190,40 258,72 190,104 122,72"/>
  <text class="c" x="190" y="69">question to</text>
  <text class="c" x="190" y="84">the agent?</text>
  <path class="e" d="M190,104 L190,114"/>
  <text class="lbl" x="196" y="112">yes</text>
  <text class="c" x="190" y="128" fill="#777">not stored</text>

  <path class="e" d="M258,72 L290,72"/>
  <text class="lbl c" x="274" y="66">no</text>
  <rect class="update" x="290" y="48" width="165" height="48" rx="8"/>
  <text class="c" x="372" y="69">drop the older copy</text>
  <text class="c" x="372" y="84">of the same sentence</text>

  <path class="e" d="M455,72 L478,72"/>
  <rect class="write" x="478" y="40" width="185" height="64" rx="8"/>
  <text class="c" x="570" y="62">tag about_other</text>
  <text class="c" x="570" y="77">(subject is another person,</text>
  <text class="c" x="570" y="92">e.g. 我朋友住高雄)</text>

  <!-- ===== MEMORY ===== -->
  <path class="e" d="M570,104 L570,150"/>
  <text class="lbl" x="576" y="132">append</text>
  <rect class="neutral" x="240" y="150" width="435" height="32" rx="6"/>
  <text class="c" x="457" y="171">memory: list of {date, text, about_other} in chronological order</text>

  <!-- ===== READ ===== -->
  <rect x="10" y="200" width="845" height="188" rx="10" fill="none" stroke="#4a9a5b" stroke-width="1.5"/>
  <text class="title" x="22" y="220" fill="#4a9a5b">READ: prepare(question)</text>

  <path class="ed" d="M355,182 L355,240"/>
  <path class="ed" d="M468,182 L468,322 L456,322"/>
  <text class="lbl" x="361" y="198" fill="#999">read</text>
  <text class="lbl" x="474" y="198" fill="#999">read</text>

  <text x="22" y="303">question</text>
  <path class="e" d="M80,299 L104,299"/>
  <polygon class="read" points="165,267 226,299 165,331 104,299"/>
  <text class="c" x="165" y="296">arithmetic</text>
  <text class="c" x="165" y="311">question?</text>
  <path class="e" d="M196,283 L260,264"/>
  <text class="lbl" x="214" y="266">yes</text>
  <rect class="update" x="260" y="240" width="190" height="52" rx="8"/>
  <text class="c" x="355" y="259">extract the user's numbers</text>
  <text class="c" x="355" y="274">(latest value wins),</text>
  <text class="c" x="355" y="288">compute in Python</text>

  <path class="e" d="M450,266 L492,266"/>
  <text class="lbl" x="497" y="243">all found</text>
  <rect class="read" x="492" y="251" width="130" height="30" rx="8"/>
  <text class="c" x="557" y="271">計算結果：19歲</text>

  <path class="e" d="M300,292 L300,320" stroke-dasharray="4 3"/>
  <text class="lbl" x="306" y="310">missing</text>

  <path class="e" d="M196,315 L260,340"/>
  <text class="lbl" x="214" y="342">no</text>
  <rect class="read" x="260" y="320" width="190" height="52" rx="8"/>
  <text class="c" x="355" y="340">exclude about_other;</text>
  <text class="c" x="355" y="354">score = bigram overlap</text>
  <text class="c" x="355" y="368">+ topic expansion terms</text>

  <path class="e" d="M450,350 L490,350"/>
  <rect class="update" x="490" y="326" width="210" height="48" rx="8"/>
  <text class="c" x="595" y="346">keep score &gt; 0 within 300 chars,</text>
  <text class="c" x="595" y="361">sorted by time (newest last)</text>

  <path class="e" d="M690,326 L725,312"/>
  <text class="lbl" x="660" y="319">match</text>
  <rect class="read" x="725" y="294" width="118" height="30" rx="8"/>
  <text class="c" x="784" y="314">context lines</text>

  <path class="e" d="M700,360 L725,362"/>
  <rect class="abst" x="725" y="336" width="118" height="44" rx="8"/>
  <text class="c" x="784" y="354">no match: empty</text>
  <text class="c" x="784" y="370">→ 你沒有提過</text>

  <!-- ===== MODEL ===== -->
  <rect class="neutral" x="870" y="250" width="122" height="78" rx="8"/>
  <text class="c" x="931" y="272">evaluation prompt</text>
  <text class="c" x="931" y="288">+ fine-tuned</text>
  <text class="c" x="931" y="303">model (E3)</text>
  <text class="c" x="931" y="319">scores A–D</text>
  <path class="e" d="M622,266 L870,266"/>
  <path class="e" d="M843,309 L870,300"/>
  <path class="e" d="M843,358 L870,318"/>
</svg>
